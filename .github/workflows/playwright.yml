name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 11:00 IST daily. GitHub cron is always UTC and IST is UTC+5:30, so 05:30 UTC.
    # GitHub queues scheduled runs behind its own load, so expect it to start a few
    # minutes late rather than exactly on the half hour.
    - cron: '30 5 * * *'
  # lets you kick off a run by hand from the Actions tab
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Job level so the mail steps can check whether the secrets are set at all - a fork PR
    # gets no secrets, and the run should still pass rather than fail trying to send mail.
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # Which tests passed and failed, as an HTML table - built from the json reporter's output
    - name: Build the results email
      if: ${{ !cancelled() }}
      run: node scripts/ci/build-test-email.js
      env:
        MAIL_FROM: ${{ secrets.MAIL_USERNAME }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        COMMIT: ${{ github.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    # curl speaks SMTP, so no third-party mail action is needed. Gmail requires an App
    # Password here (a normal account password is rejected) - see README/repo secrets.
    - name: Email the results
      if: ${{ !cancelled() && env.MAIL_USERNAME != '' }}
      run: |
        curl --silent --show-error --ssl-reqd \
          --url 'smtps://smtp.gmail.com:465' \
          --user "$MAIL_USERNAME:$MAIL_PASSWORD" \
          --mail-from "$MAIL_USERNAME" \
          --mail-rcpt "$MAIL_TO" \
          --upload-file test-results/email.txt
